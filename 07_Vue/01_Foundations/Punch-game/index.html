<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Computed vs Method Execution Test</title>
        <link href="styles.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    </head>
    <body>

        <div id="vue-app">
            <!-- Bag image -->
             <div id="bag" v-bind:class="{burst:isEnded}"></div>

            <!-- bag health -->
            <div id="bag-health">
                <div v-bind:style="{width: health + '%'}"></div>
            </div>

            <!-- bag controls -->
            <div id="controls">
                <button @click = "punch" v-show="!isEnded">Punch</button>
                <button @click = "restart" >Restart</button>
            </div>

        </div>

        <script src="app.js"></script>
    </body>
</html>
